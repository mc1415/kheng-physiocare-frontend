<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory - Kheng PhysioCare Admin</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="css/admin-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</head>
<body>

    <div class="admin-wrapper">
        <!-- =========== SIDEBAR =========== -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <img src="../images/LOGOWHITE.png" alt="Logo" class="sidebar-logo">
            </div>
            <ul class="sidebar-menu">
                <li class="menu-item"><a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i><span data-i18n="dashboard">Dashboard</span></a></li>
                <li class="menu-item"><a href="pos.html"><i class="fa-solid fa-cash-register"></i><span data-i18n="pos">POS</span></a></li>
                <li class="menu-item"><a href="appointments.html"><i class="fa-solid fa-calendar-check"></i><span data-i18n="appointments">Appointments</span></a></li>
                <li class="menu-item"><a href="patients.html"><i class="fa-solid fa-users"></i><span data-i18n="patients">Patients</span></a></li>
                <li class="menu-item"><a href="billing.html"><i class="fa-solid fa-file-invoice-dollar"></i><span data-i18n="billing">Billing</span></a></li>
                <li class="menu-item"><a href="exercises.html"><i class="fa-solid fa-person-running"></i><span data-i18n="exercises">Exercises</span></a></li>
                <li class="menu-item active"><a href="inventory.html"><i class="fa-solid fa-pills"></i><span data-i18n="inventory">Inventory</span></a></li>
                <li class="menu-item"><a href="staff.html"><i class="fa-solid fa-user-doctor"></i><span data-i18n="staff">Staff</span></a></li>
                <hr class="sidebar-divider">
                <li class="menu-item"><a href="settings.html"><i class="fa-solid fa-gear"></i><span data-i18n="settings">Settings</span></a></li>
                <li class="menu-item"><a href="index.html"><i class="fa-solid fa-right-from-bracket"></i><span data-i18n="logout">Logout</span></a></li>
            </ul>
        </nav>
        <div class="sidebar-overlay"></div>

        <!-- =========== MAIN CONTENT =========== -->
        <main class="main-content">
            <header class="top-bar">
                <div class="top-bar-left">
                    <button class="sidebar-toggle"><i class="fa-solid fa-bars"></i></button>
                    <h1 class="page-title" data-i18n="inventory">Inventory</h1>
                </div>
                <div class="top-bar-right">
                    <div class="language-toggle">
                        <i class="fa-solid fa-earth-asia"></i>
                        <div class="language-pill-group" aria-label="Language Switch">
                            <button type="button" class="lang-pill" data-lang="en">EN</button>
                            <button type="button" class="lang-pill" data-lang="km">KM</button>
                        </div>
                    </div>
                    <button id="addProductBtn" class="btn-primary-action"><i class="fa-solid fa-plus"></i> <span data-i18n="addProduct">Add New Product</span></button>
                </div>
            </header>

            <div class="card">
                <div class="card-header">
                    <h3 data-i18n="allProducts">All Products</h3>
                </div>
                <div class="card-body">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Product Name</th>
                                <th>SKU</th>
                                <th>Category</th>
                                <th>Stock on Hand</th>
                                <th>Price</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                        <!-- Data will be loaded by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="addProductModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <!-- Add an ID to the title -->
            <h2 id="productModalTitle">Add New Product to Inventory</h2>
            <button id="closeProductModalBtn" class="close-button">&times;</button>
        </div>
        <div class="modal-body">
            <form id="add-product-form">
                <input type="hidden" id="productIdField" name="productId">
                <input type="hidden" id="product-image-url" name="image_url">
                <div class="form-grid">
                    <div class="form-group span-2">
                        <label for="product-name">Product Name</label>
                        <input type="text" id="product-name" name="name" required> <!-- CHANGE name -->
                    </div>
                    <div class="form-group">
                        <label for="product-sku">SKU</label>
                        <input type="text" id="product-sku" name="sku" placeholder="e.g., KPC-GEL-01"> <!-- CHANGE name -->
                    </div>
                    <div class="form-group">
                        <label for="product-category">Category</label>
                        <input type="text" id="product-category" name="category" placeholder="e.g., Topicals"> <!-- CHANGE name -->
                    </div>
                    <div class="form-group">
                        <label for="product-stock">Stock Level</label>
                        <input type="number" id="product-stock" name="stock_level" value="0" min="0" required> <!-- CHANGE name -->
                    </div>
                    <div class="form-group">
                        <label for="product-price">Price ($)</label>
                        <input type="number" id="product-price" name="unit_price" step="0.01" value="0.00" required> <!-- CHANGE name -->
                    </div>
                    <div class="form-group span-2">
                        <label for="product-image-file">Product Image</label>
                        <div class="image-uploader-container">
                            <label for="product-image-file" id="product-image-drop-zone" class="image-drop-zone">
                                <img id="product-image-preview" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="Product image preview">
                                <div id="product-image-prompt" class="drop-zone-prompt">
                                    <i class="fa-solid fa-image"></i>
                                    <span>Click to upload or drag and drop</span>
                                </div>
                            </label>
                            <input type="file" id="product-image-file" accept="image/*" hidden>
                            <p class="image-upload-note">JPG, PNG, WEBP up to 2MB</p>
                            <button type="button" id="remove-product-image-btn" class="btn-danger">Remove Image</button>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" id="saveProductBtn" class="btn-primary-action">Save Product</button>
                </div>
            </form>
        </div>
    </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-init.js"></script>
    <script src="js/global.js"></script>
    <script src="js/inventory.js?v=20260223-01"></script>
    <script src="../js/language.js"></script>

</body>
</html>
